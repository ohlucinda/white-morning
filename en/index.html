<div class="video-modal" id="video-modal" aria-hidden="true">
  <div class="video-modal-inner" role="dialog" aria-modal="true" aria-label="PLAY">
    <button class="video-close" type="button" aria-label="×">×</button>
    <video controls playsinline preload="metadata"></video>
  </div>
</div>
<script>
(() => {
  const modal = document.getElementById('video-modal');
  const video = modal.querySelector('video');
  const closeButton = modal.querySelector('.video-close');
  const open = (src) => {
    video.src = src;
    modal.classList.add('is-open');
    modal.setAttribute('aria-hidden', 'false');
    document.body.classList.add('modal-open');
    video.play().catch(() => {});
  };
  const close = () => {
    video.pause();
    video.removeAttribute('src');
    video.load();
    modal.classList.remove('is-open');
    modal.setAttribute('aria-hidden', 'true');
    document.body.classList.remove('modal-open');
  };
  document.querySelectorAll('[data-video]').forEach(button => {
    button.addEventListener('click', () => open(button.dataset.video));
  });
  closeButton.addEventListener('click', close);
  modal.addEventListener('click', e => { if (e.target === modal) close(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && modal.classList.contains('is-open')) close(); });
})();
</script>
